; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = aicanvas_esp32_75bw
src_dir = .
boards_dir = boards

[common_env_data]
framework = arduino
upload_speed = 921600
monitor_speed = 115200
lib_deps =
	Wire
	bblanchon/ArduinoJson@^6.19.4
	FS
	Update
	khoih-prog/ESP_MultiResetDetector@^1.3.1
	esphome/ESPAsyncWebServer-esphome@^3.1.0
extra_scripts =
	pre:platformio_version_increment/version_increment_pre.py

; Shared base for all AI Canvas envs (extend via extends=aicanvas_base)
[aicanvas_base]
platform = espressif32
framework = ${common_env_data.framework}
upload_speed = ${common_env_data.upload_speed}
monitor_speed = ${common_env_data.monitor_speed}
monitor_filters = time, colorize, esp32_exception_decoder
board_build.partitions = partitions_ota_large_app.csv
build_src_filter =
	+<*>
lib_deps =
	${common_env_data.lib_deps}
	bitbank2/PNGdec@^1.0.1
	ricmoo/QRCode@^0.0.1
build_flags =
	-D AI_CANVAS=1
	-D EPD_BW_ONLY=1
	-D CONFIG_ESP_TASK_WDT_TIMEOUT_S=10
extra_scripts = ${common_env_data.extra_scripts}

; ==========================================================================
; ESP32 (original board) + 7.5" B/W (800x480)
; ==========================================================================
[env:aicanvas_esp32_75bw]
extends = aicanvas_base
board = esp32dev
build_flags =
	${aicanvas_base.build_flags}
	-D epd75_3c=1
	-D FIRMWARE_ENVIRONMENT=\"aicanvas_esp32_75bw\"

; ==========================================================================
; ESP32 (original board) + 10.2" B/W (GDEM102T91 / SSD1677, 960x640)
; ==========================================================================
[env:aicanvas_esp32_102bw]
extends = aicanvas_base
board = esp32dev
build_flags =
	${aicanvas_base.build_flags}
	-D EPD_PANEL_SSD1677=1
	-D EPD_WIDTH=960
	-D EPD_HEIGHT=640
	-D FIRMWARE_ENVIRONMENT=\"aicanvas_esp32_102bw\"

; ==========================================================================
; Seeed XIAO ePaper Display Board EE04 (XIAO ESP32-S3 Plus) + 7.5" B/W
;   TRMNL OG DIY Kit hardware — see https://wiki.seeedstudio.com/epaper_ee04/
;   Pins: SCK=7 MOSI=9 MISO=-1 CS=44 DC=10 BUSY=4 RST=38 EN=43(HIGH)
; ==========================================================================
[env:aicanvas_xiao_ee04_75bw]
extends = aicanvas_base
board = seeed_xiao_esp32s3
build_flags =
	${aicanvas_base.build_flags}
	-D epd75_3c=1
	-D BOARD_XIAO_EE04=1
	-D EPD_BUSY_PIN=4
	-D EPD_DC_PIN=10
	-D EPD_CS_PIN=44
	-D EPD_SCK_PIN=7
	-D EPD_MOSI_PIN=9
	-D EPD_RST_PIN=38
	-D EPD_MISO_PIN=-1
	-D EPD_ENABLE_PIN=43
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D FIRMWARE_ENVIRONMENT=\"aicanvas_xiao_ee04_75bw\"

; ==========================================================================
; Seeed XIAO ePaper Display Board EE04 + 10.2" B/W (SSD1677, 960x640)
; ==========================================================================
[env:aicanvas_xiao_ee04_102bw]
extends = aicanvas_base
board = seeed_xiao_esp32s3
build_flags =
	${aicanvas_base.build_flags}
	-D EPD_PANEL_SSD1677=1
	-D EPD_WIDTH=960
	-D EPD_HEIGHT=640
	-D BOARD_XIAO_EE04=1
	-D EPD_BUSY_PIN=4
	-D EPD_DC_PIN=10
	-D EPD_CS_PIN=44
	-D EPD_SCK_PIN=7
	-D EPD_MOSI_PIN=9
	-D EPD_RST_PIN=38
	-D EPD_MISO_PIN=-1
	-D EPD_ENABLE_PIN=43
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D FIRMWARE_ENVIRONMENT=\"aicanvas_xiao_ee04_102bw\"
